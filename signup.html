<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up — Wanderlust</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand px-4" aria-label="signup Navigation">
        <a href="./index.html" class="navbar-brand">Wander<span>lust</span></a>
        <div class="ms-auto">
          <a href="./signin.html" class="nav-link-custom"> Sign In → </a>
        </div>
      </nav>
    </header>
    <main>
      <div class="row g-0 mt-5 auth-row">
        <aside
          class="d-none d-md-block col-md-5 col-lg-6 panel"
          aria-hidden="true"
        >
          <img
            src="./images/signup-image.webp"
            alt="Mountain lake at golden hour"
            loading="eager"
          />
          <div class="panel-overlay"></div>
          <div class="panel-text">
            <p>Begin Your Journey</p>
            <h2>"Not all those who wander are lost."</h2>
          </div>
        </aside>

        <section
          class="col-12 col-md-7 col-lg-6 d-flex align-items-center justify-content-center py-5"
          aria-labelledby="signup-heading"
        >
          <div class="form-box w-100">
            <h1 id="signup-heading">Create <em>Account</em></h1>
            <p class="subtitle">
              Join Voyagé and start planning your next luxury escape.
            </p>

            <form action="" id="signupForm" novalidate autocomplete="off">
              <div class="field">
                <label for="fullName">Full Name</label>
                <input
                  type="text"
                  id="fullName"
                  name="fullName"
                  placeholder="e.g. John Doe"
                  required
                />
                <span class="msg" id="msgFullName"></span>
              </div>

              <div class="row g-2">
                <div class="col-12 col-sm-6">
                  <div class="field">
                    <label for="email">Email Address</label>
                    <input
                      type="email"
                      id="email"
                      name="email"
                      placeholder="you@mail.com"
                      required
                    />
                    <span class="msg" id="msgEmail"></span>
                  </div>
                </div>

                <div class="col-12 col-sm-6">
                  <div class="field">
                    <label for="phone">Phone Number</label>
                    <input
                      type="tel"
                      id="phone"
                      placeholder="10-digit number"
                      maxlength="10"
                      required
                    />
                    <span class="msg" id="msgPhone"></span>
                  </div>
                </div>
              </div>

              <div class="field">
                <label for="city">City / Location</label>
                <input
                  type="text"
                  id="city"
                  name="city"
                  placeholder="e.g. Mumbai"
                  required
                />
                <span class="msg" id="msgCity"></span>
              </div>

              <div class="row g-2">
                <div class="col-12 col-sm-6">
                  <div class="field">
                    <label for="password">Password</label>
                    <div class="field-wrap">
                      <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Min 8 chars"
                        required
                      />
                      <button
                        type="button"
                        class="eye-btn"
                        aria-label="Show or hide password"
                      >
                        👁
                      </button>
                    </div>
                    <div class="strength-bar">
                      <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <span class="msg" id="msgPassword"></span>
                    <span
                      id="strengthLabel"
                      class="strength-label"
                    ></span>
                  </div>
                </div>
                <div class="col-12 col-sm-6">
                  <div class="field">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="field-wrap">
                      <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter password"
                        required
                      />
                      <button
                        type="button"
                        class="eye-btn"
                        aria-label="Show or hide confirm password"
                      >
                        👁
                      </button>
                    </div>
                    <span class="msg" id="msgConfirmPassword"></span>
                  </div>
                </div>
              </div>

               <button type="submit" class="btn-voyge">Create Account</button>
            </form>

            <p class="redirect">Already have an account? <a href="./signin.html">Sign In →</a></p>
          </div>
        </section>
      </div>
    </main>

    <!-- Bootstrap JS -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

     <!-- Custom JS -->
      <script src="./js/auth.js"></script>
  </body>
</html>
