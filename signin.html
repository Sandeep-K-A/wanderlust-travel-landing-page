<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — Wanderlust</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand px-4" aria-label="signup Navigation">
        <a href="./index.html" class="navbar-brand">Wander<span>lust</span></a>
        <div class="ms-auto">
          <a href="./signup.html" class="nav-link-custom"> Sign Up → </a>
        </div>
      </nav>
    </header>

    <main>
      <div class="row g-0 mt-5 auth-row">
        <aside
          class="d-none d-md-block col-md-5 col-lg-6 panel"
          aria-hidden="true"
        >
          <img
            src="./images/signin-image.webp"
            alt="Mountain lake at golden hour"
            loading="eager"
          />
          <div class="panel-overlay"></div>
          <div class="panel-text">
            <p>Begin Your Journey</p>
            <h2>"Not all those who wander are lost."</h2>
          </div>
        </aside>

        <section
          class="col-12 col-md-7 col-lg-6 d-flex align-items-center justify-content-center py-5"
          aria-labelledby="signin-heading"
        >
        <div class="form-box w-100">
            <h1 id="signin-heading">Welcome <em>Back</em></h1>
          <p class="subtitle">Sign in to access your itineraries and concierge services.</p>

          <form id="signinForm" novalidate autocomplete="on">

            <div class="field">
              <label for="siEmail">Email Address</label>
              <input type="email" id="siEmail" name="email"
                     placeholder="you@mail.com" autocomplete="email" required />
              <span class="msg" id="msgSiEmail"></span>
            </div>

             <div class="field">
              <label for="siPassword">Password</label>
              <div class="field-wrap">
                <input type="password" id="siPassword" name="password"
                       placeholder="Your password" autocomplete="current-password" required />
                <button type="button" class="eye-btn" aria-label="Show or hide password">👁</button>
              </div>
              <span class="msg" id="msgSiPassword"></span>
            </div>

            <button type="submit" class="btn-voyge">Sign In</button>
          </form>

          
          <p class="redirect">Don't have an account? <a href="./signup.html">Sign Up →</a></p>
        </div>
    </section>
      </div>
    </main>

    <!-- Bootstrap JS -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

     <!-- Custom JS -->
      <script src="./js/auth.js"></script>
  </body>
</html>
